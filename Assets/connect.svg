<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="340" viewBox="0 0 1440 340" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.5" stop-color="#0a0d2a"/>
      <stop offset="1" stop-color="#1c2580"/>
    </linearGradient>
    <radialGradient id="glow" cx="720" cy="170" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a52e0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3a52e0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#6f86ff" stroke-opacity="0.07"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141d58" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0a0f33" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="titleShine" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bff3ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="500 0;1000 0;1000 0" keyTimes="0;0.4;1" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="cardShine" gradientUnits="userSpaceOnUse" x1="-150" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1600 0;1600 0" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="lineShine" gradientUnits="userSpaceOnUse" x1="-120" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#1db4e8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#1db4e8" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="80 0;1480 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="titleClip"><text x="720" y="95" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="1">Connect Now</text></clipPath>
    <clipPath id="c1"><rect x="80" y="150" width="410" height="120" rx="22"/></clipPath>
    <clipPath id="c2"><rect x="515" y="150" width="410" height="120" rx="22"/></clipPath>
    <clipPath id="c3"><rect x="950" y="150" width="410" height="120" rx="22"/></clipPath>
  </defs>

  <rect width="1440" height="340" fill="url(#bg)"/>
  <rect width="1440" height="340" fill="url(#grid)"/>
  <rect width="1440" height="340" fill="url(#glow)"/>

  <g fill="#8fa6ff">
    <circle cx="200" cy="40" r="2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1230" cy="60" r="2"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="305" r="2"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1350" cy="310" r="2"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Header -->
  <text x="726" y="101" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="1" fill="#16315c" opacity="0.9">Connect Now</text>
  <text x="720" y="95" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="1" fill="#ffffff">Connect Now</text>
  <g clip-path="url(#titleClip)"><rect x="480" y="40" width="480" height="70" fill="url(#titleShine)"/></g>
  <rect x="80" y="122" width="1280" height="4" rx="2" fill="#1b3a8c" fill-opacity="0.55"/>
  <rect x="80" y="122" width="1280" height="4" rx="2" fill="url(#lineShine)"/>

  <!-- Card 1: YouTube -->
  <g>
    <rect x="80" y="150" width="410" height="120" rx="22" fill="url(#card)" stroke="#ff3b3b" stroke-opacity="0.6" stroke-width="1.6"><animate attributeName="stroke-opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/></rect>
    <g clip-path="url(#c1)"><rect x="80" y="150" width="410" height="120" fill="url(#cardShine)"/></g>
    <g filter="url(#neon)">
      <rect x="112" y="184" width="68" height="48" rx="13" fill="#ff0000"/>
      <path d="M137 197 L137 219 L158 208 Z" fill="#fff"/>
    </g>
    <text x="204" y="199" font-family="'Courier New',monospace" font-size="13" fill="#ff8a8a" letter-spacing="3">YOUTUBE</text>
    <text x="204" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">youtube.com/@MUdevelops</text>
  </g>

  <!-- Card 2: GitHub -->
  <g>
    <rect x="515" y="150" width="410" height="120" rx="22" fill="url(#card)" stroke="#c9d1f0" stroke-opacity="0.55" stroke-width="1.6"><animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/></rect>
    <g clip-path="url(#c2)"><rect x="515" y="150" width="410" height="120" fill="url(#cardShine)"><animateTransform attributeName="transform" type="translate" values="0 0" dur="1s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(545 177) scale(2.5)" filter="url(#neon)">
      <path fill="#ffffff" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
    </g>
    <text x="619" y="199" font-family="'Courier New',monospace" font-size="13" fill="#b8c4ff" letter-spacing="3">GITHUB</text>
    <text x="619" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">github.com/MUdevelops</text>
  </g>

  <!-- Card 3: Portfolio -->
  <g>
    <rect x="950" y="150" width="410" height="120" rx="22" fill="url(#card)" stroke="#1db4e8" stroke-opacity="0.6" stroke-width="1.6"><animate attributeName="stroke-opacity" values="0.8;0.3;0.8" dur="3s" begin="1s" repeatCount="indefinite"/></rect>
    <g clip-path="url(#c3)"><rect x="950" y="150" width="410" height="120" fill="url(#cardShine)"/></g>
    <g filter="url(#neon)">
      <rect x="980" y="182" width="72" height="52" rx="10" fill="#0b1a44" stroke="#1db4e8" stroke-width="2.5"/>
      <path d="M980 196H1052" stroke="#1db4e8" stroke-width="2.5"/>
      <circle cx="990" cy="189" r="2" fill="#1db4e8"/><circle cx="997" cy="189" r="2" fill="#1db4e8"/><circle cx="1004" cy="189" r="2" fill="#1db4e8"/>
      <circle cx="1016" cy="216" r="11" stroke="#fff" stroke-width="2"/>
      <ellipse cx="1016" cy="216" rx="4.5" ry="11" stroke="#fff" stroke-width="1.6"/>
      <path d="M1005 216H1027" stroke="#fff" stroke-width="1.6"/>
      <path d="M1034 207h12M1034 214h8M1034 221h10" stroke="#1db4e8" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="1074" y="199" font-family="'Courier New',monospace" font-size="13" fill="#7fd8f5" letter-spacing="3">PORTFOLIO</text>
    <text x="1074" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#ffffff">m-umar-jamal.netlify.app</text>
  </g>

  <!-- Footer -->
  <text x="80" y="312" font-family="'Courier New',monospace" font-size="14" fill="#7d8cc8" letter-spacing="2.5">BUILD  •  INTEGRATE  •  TEST  •  SHIP</text>
  <text x="1360" y="312" text-anchor="end" font-family="'Courier New',monospace" font-size="14" fill="#7d8cc8" letter-spacing="2">MUDEVELOPS / 2026</text>

  <!-- Sparkles -->
  <g fill="#fff">
    <path d="M440 62 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></path>
    <path d="M1000 70 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5z" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="1.2s" dur="3.5s" repeatCount="indefinite"/></path>
  </g>
</svg>
