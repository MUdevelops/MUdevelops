<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.45" stop-color="#0a0d2a"/>
      <stop offset="0.8" stop-color="#1c2580"/>
      <stop offset="1" stop-color="#1a3aa8"/>
    </linearGradient>
    <radialGradient id="glow" cx="1125" cy="210" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a52e0" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#2a3cc0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2a3cc0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#6f86ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-160" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bff3ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 900 0; 900 0" keyTimes="0;0.4;1" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="barShine" gradientUnits="userSpaceOnUse" x1="-120" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="80 0; 1480 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14204e"/>
      <stop offset="1" stop-color="#090d24"/>
    </linearGradient>
    <linearGradient id="chipSheen" gradientUnits="userSpaceOnUse" x1="1080" y1="160" x2="1170" y2="250">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="titleClip"><text x="80" y="165" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="92" font-weight="800">MUdevelops</text></clipPath>
    <clipPath id="barClip"><rect x="80" y="372" width="150" height="7" rx="3.5"><animate attributeName="width" values="150;1280;150" keyTimes="0;0.5;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1440" height="420" fill="url(#bg)"/>
  <rect width="1440" height="420" fill="url(#grid)"/>
  <rect width="1440" height="420" fill="url(#glow)"/>

  <!-- Floating particles -->
  <g fill="#8fa6ff">
    <circle cx="805" cy="55" r="2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="985" cy="125" r="2"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="745" cy="265" r="2"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="905" cy="63" r="2.5"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1320" cy="320" r="2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1255" cy="145" r="2"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="388" r="2"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Top-right tag -->
  <rect x="1156" y="27" width="246" height="30" rx="10" fill="#0c1240" fill-opacity="0.7" stroke="#4a62c8" stroke-opacity="0.7"/>
  <text x="1279" y="48" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#9fb0e8" letter-spacing="2">IDEAS  /  CODE  /  SYSTEMS</text>

  <!-- Title -->
  <text x="86" y="171" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="92" font-weight="800" fill="#16315c" opacity="0.9">MUdevelops</text>
  <text x="80" y="165" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="92" font-weight="800" fill="#ffffff">MUdevelops</text>
  <g clip-path="url(#titleClip)"><rect x="60" y="80" width="600" height="100" fill="url(#shine)"/></g>

  <!-- Subtitle row -->
  <rect x="82" y="198" width="17" height="17" rx="4" fill="#1db4e8" filter="url(#neon)"/>
  <text x="113" y="215" font-family="'Segoe UI',Arial,sans-serif" font-size="25" font-weight="700" fill="#1db4e8" letter-spacing="1.5" filter="url(#neon)">AI APPLICATION ENGINEERING</text>
  <text x="82" y="262" font-family="'Segoe UI',Arial,sans-serif" font-size="19" fill="#d3daf5">Building intelligent software — one system at a time.</text>

  <!-- Pills -->
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="82" y="297" width="60" height="30" rx="10" fill="#101852" fill-opacity="0.8" stroke="#4a5bb8"/>
    <text x="112" y="317" fill="#8f9ed8">LLMs</text>
    <rect x="151" y="297" width="54" height="30" rx="10" fill="#0e2a55" fill-opacity="0.9" stroke="#1db4e8"><animate attributeName="stroke-opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/></rect>
    <text x="178" y="317" fill="#1db4e8">RAG</text>
    <rect x="214" y="297" width="98" height="30" rx="10" fill="#101852" fill-opacity="0.8" stroke="#4a5bb8"/>
    <text x="263" y="317" fill="#8f9ed8">AI AGENTS</text>
    <rect x="321" y="297" width="100" height="30" rx="10" fill="#101852" fill-opacity="0.8" stroke="#4a5bb8"/>
    <text x="371" y="317" fill="#8f9ed8">PRODUCTS</text>
  </g>

  <!-- Progress bar -->
  <rect x="80" y="372" width="1280" height="7" rx="3.5" fill="#1b3a8c" fill-opacity="0.55"/>
  <rect x="80" y="372" width="150" height="7" rx="3.5" fill="#1db4e8" filter="url(#neon)">
    <animate attributeName="width" values="150;1280;150" keyTimes="0;0.5;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <g clip-path="url(#barClip)"><rect x="80" y="372" width="1280" height="7" fill="url(#barShine)"/></g>
  <text x="82" y="402" font-family="'Courier New',monospace" font-size="14" fill="#7d8cc8" letter-spacing="2.5">BUILD  •  INTEGRATE  •  TEST  •  SHIP</text>
  <text x="1338" y="402" text-anchor="end" font-family="'Courier New',monospace" font-size="14" fill="#7d8cc8" letter-spacing="2">MUDEVELOPS / 2026</text>

  <!-- Orbit graphic -->
  <g>
    <circle cx="1125" cy="210" r="150" fill="#2c3fd0" fill-opacity="0.18" filter="url(#soft)"/>
    <circle cx="1125" cy="210" r="147" stroke="#5f78e8" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="1125" cy="210" r="100" stroke="#6f88f0" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="1125" cy="210" r="75" stroke="#1db4e8" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="2 4"/>
    <circle cx="1125" cy="210" r="60" stroke="#1db4e8" stroke-opacity="0.25" stroke-width="1"/>

    <!-- grey tilted arc -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 1125 210;360 1125 210" dur="30s" repeatCount="indefinite"/>
      <path d="M983 190 Q1000 280 1175 278" stroke="#9aa0b8" stroke-opacity="0.85" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <!-- cyan arcs -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 1125 210;-360 1125 210" dur="14s" repeatCount="indefinite"/>
      <circle cx="1125" cy="210" r="140" stroke="#1db4e8" stroke-width="4" stroke-linecap="round" stroke-dasharray="190 700" filter="url(#neon)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 1125 210;360 1125 210" dur="9s" repeatCount="indefinite"/>
      <circle cx="1125" cy="210" r="104" stroke="#38c8f5" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="110 545" filter="url(#neon)"/>
    </g>

    <!-- orbiting nodes -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 1125 210;360 1125 210" dur="40s" repeatCount="indefinite"/>
      <g fill="#fff"><circle cx="1066" cy="97" r="5" filter="url(#neon)"/><circle cx="1027" cy="131" r="5" fill="#b8c4ff"/><circle cx="1245" cy="197" r="4" fill="#9fdcff"/><circle cx="1177" cy="315" r="5" filter="url(#neon)"/></g>
      <circle cx="1117" cy="82" r="6" fill="#8ea0ff"/><circle cx="1185" cy="99" r="3" fill="#1db4e8"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="360 1125 210;0 1125 210" dur="25s" repeatCount="indefinite"/>
      <circle cx="1240" cy="288" r="5" fill="#c9a0b8" fill-opacity="0.8"/>
      <circle cx="1065" cy="285" r="3.5" fill="#1db4e8"/>
      <circle cx="982" cy="202" r="3.5" fill="#1db4e8" filter="url(#neon)"/>
    </g>

    <!-- chip -->
    <g stroke="#6f86c8" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round">
      <path d="M1100 160v-12M1115 160v-12M1130 160v-12M1145 160v-12M1160 160v-12M1100 260v12M1115 260v12M1130 260v12M1145 260v12M1160 260v12M1080 180h-12M1080 195h-12M1080 210h-12M1080 225h-12M1080 240h-12M1172 180h12M1172 195h12M1172 210h12M1172 225h12M1172 240h12" transform="translate(-0 0)"/>
    </g>
    <rect x="1080" y="160" width="90" height="100" rx="20" fill="url(#chipGrad)" stroke="#1db4e8" stroke-width="2.5" filter="url(#neon)">
      <animate attributeName="stroke-opacity" values="1;0.55;1" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="1080" y="160" width="90" height="100" rx="20" fill="url(#chipSheen)"/>
    <text x="1125" y="222" text-anchor="middle" font-family="'Courier New',monospace" font-size="30" font-weight="700" fill="#1db4e8" filter="url(#neon)">&lt;/&gt;</text>
  </g>

  <!-- Sparkles -->
  <g fill="#fff">
    <path d="M520 70 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.6;1.1;0.6" dur="3s" additive="sum" repeatCount="indefinite"/></path>
    <path d="M1235 110 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5z" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="1s" dur="3.5s" repeatCount="indefinite"/></path>
    <path d="M980 300 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="2s" dur="4s" repeatCount="indefinite"/></path>
    <path d="M640 140 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="2.4s" dur="4s" repeatCount="indefinite"/></path>
  </g>
</svg>
