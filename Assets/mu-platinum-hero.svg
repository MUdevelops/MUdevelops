<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">MUdevelops Platinum Diamond Hero</title>
  <desc id="desc">Obsidian black and platinum futuristic engineering banner for MUdevelops.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020305"/>
      <stop offset="0.55" stop-color="#090C10"/>
      <stop offset="1" stop-color="#020305"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8F99A3"/>
      <stop offset="0.28" stop-color="#F4F7F9"/>
      <stop offset="0.52" stop-color="#B8C0C8"/>
      <stop offset="0.78" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8F99A3"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9FEAFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>

  <g opacity="0.26" stroke="#9CA6B0" stroke-width="1">
    <path d="M70 74H1530M70 112H1530M70 308H1530M70 346H1530"/>
    <path d="M160 50V370M400 50V370M1200 50V370M1440 50V370"/>
  </g>

  <g opacity="0.18" fill="none" stroke="#B8C0C8" stroke-width="1">
    <path d="M85 215H310L380 145H520"/>
    <path d="M1080 128H1240L1310 198H1510"/>
    <path d="M1120 305H1280L1330 255H1518"/>
  </g>

  <g transform="translate(1210 210)" opacity="0.85">
    <polygon points="0,-124 110,-60 88,82 0,132 -88,82 -110,-60" fill="#0D1117" stroke="url(#metal)" stroke-width="3"/>
    <polygon points="0,-124 0,10 -88,82 -110,-60" fill="#1C232A" stroke="#D9DEE3" stroke-opacity="0.55"/>
    <polygon points="0,-124 110,-60 0,10" fill="#EEF2F5" fill-opacity="0.18" stroke="#F4F7F9" stroke-opacity="0.72"/>
    <polygon points="0,10 88,82 0,132" fill="#B8C0C8" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.56"/>
    <polygon points="0,10 -88,82 0,132" fill="#7F8A95" fill-opacity="0.15" stroke="#D9DEE3" stroke-opacity="0.45"/>
    <path d="M-82 -12L0 10L78 -15" fill="none" stroke="#9FEAFF" stroke-width="2" opacity="0.75" filter="url(#glow)"/>
  </g>

  <path d="M160 318 C 380 215, 480 350, 690 315 S 1030 205, 1410 330" fill="none" stroke="#4A545E" stroke-width="34" opacity="0.20"/>
  <path d="M160 316 C 380 214, 480 348, 690 313 S 1030 203, 1410 328" fill="none" stroke="url(#metal)" stroke-width="3" opacity="0.88"/>
  <path d="M190 319 C 380 222, 485 343, 690 308 S 1030 208, 1400 322" fill="none" stroke="url(#ice)" stroke-width="2" opacity="0.72"/>

  <g fill="#F4F7F9" opacity="0.65">
    <circle cx="114" cy="110" r="2"/><circle cx="260" cy="332" r="2"/><circle cx="540" cy="88" r="1.7"/>
    <circle cx="980" cy="72" r="1.7"/><circle cx="1450" cy="122" r="2"/><circle cx="1490" cy="300" r="1.8"/>
  </g>

  <g text-anchor="middle">
    <text x="800" y="160" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="3" fill="url(#metal)">MUdevelops</text>
    <text x="800" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#F4F7F9">APPLICATION ENGINEERING  |  AI  |  SOFTWARE</text>
    <text x="800" y="247" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="4" fill="#9CA6B0">PLATINUM DIAMOND AI ENGINEERING LABORATORY</text>
  </g>

  <g fill="none" stroke="#D9DEE3" stroke-width="2" opacity="0.55">
    <path d="M80 39h160"/><path d="M1360 381h160"/>
  </g>
  <circle cx="800" cy="281" r="4" fill="#9FEAFF"/>
</svg>
